inductance: 0.0013
holding_torque: 0.82
max_current: 3.5
steps_per_revolution: 200

[motor_constants ldo-42sth60-2004ac]	# Z axis stepper motors - not exact but similar values
resistance: 2.1
inductance: 0.0041
holding_torque: 0.85
max_current: 2
steps_per_revolution: 200

[autotune_tmc stepper_y]
motor: moons-ml23hs8l4550-20
voltage:24

[autotune_tmc stepper_x]
