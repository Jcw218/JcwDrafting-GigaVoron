####################################################################################
# Machine type: JcwGiga
# Current configuration version: VBeta
# Date：2025-10-01
####################################################################################

[mcu]
canbus_uuid: xxxxxxxxxxxxx #Put your mainboard CANBus ID here
canbus_interface: can0

[include plr.cfg]
[include fluidd.cfg]
#[include EBBCanRP2040.cfg]		#EBB SB2209 (Raspberry pi chip)
#[include EBBCan.cfg]	#EBB SB2209 (STM chip)
#[include KAMP_Settings.cfg]
#[include timelapse.cfg]
[include Knomi.cfg]

[virtual_sdcard]
path: /home/biqu/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[include shell_command.cfg]
[include moonraker_obico_macros.cfg]

[force_move]
enable_force_move : true

[pause_resume]

[gcode_button kill_switch]	#Orangestorm Giga Estop at the front of the machine
pin: !PE11
press_gcode: M112

[display_status]
[gcode_arcs]
[exclude_object]
[respond]

[save_variables]
filename: ~/printer_data/config/variables.cfg

[auto_speed]

[idle_timeout]
timeout: 7200
gcode:
    {% if printer[printer.toolhead.extruder].temperature > 160 %}
    {action_respond_info("Extruder powered down on idle timeout.")}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={140}
    SET_IDLE_TIMEOUT TIMEOUT=259200
    {% else %}
    TURN_OFF_HEATERS
    {% endif %}
    
[printer]
kinematics:cartesian
max_velocity: 500	#modified x and y axis, OEM Giga Value is 500
max_accel: 15000	#modified x and y axis, OEM Giga value is 5000
#max_accel_to_decel: 5000	#Klipper version 12 required this but 13 does not
max_z_velocity: 20
max_z_accel: 300	#modified z axis, OEM Giga Value is 200
square_corner_velocity: 5.0

###############################################################
## X/Y Stepper Settings
###############################################################

[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 59.8519
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG6
position_min: -5
position_endstop: 815
position_max: 815.5
homing_speed: 100	#max 100 OEM Giga value is 80
homing_retract_dist:10
second_homing_speed:10
homing_positive_dir:true
step_pulse_duration:0.000002

[stepper_y]
step_pin:PG0
dir_pin:PG1
enable_pin:!PF15
microsteps:16
rotation_distance: 59.8519
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
gear_ratio: 50:20
endstop_pin: PG9
position_min: -1.0
position_endstop:805.0
position_max:805.5
homing_speed:100	#max 100 OEM Giga value is 80
homing_retract_dist:10
second_homing_speed:10
homing_positive_dir:true
step_pulse_duration:0.000002

#####################################################################
#   Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
gear_ratio: 50:20
full_steps_per_rotation: 200
endstop_pin: PG10 
position_endstop: 11
position_max: 1020
position_min: -15	#OEM Giga value is -12
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 5
homing_positive_dir:false

[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA2
microsteps: 16
rotation_distance: 8
gear_ratio: 50:20
full_steps_per_rotation: 200
endstop_pin: PG11

