[motor_constants moons-ml23hs8l4550-20]	# x axis stepper motor - not exact but similar values - OEM  Giga stated x axis as ldo-42sth60-2004ac with 0.45 resistance, 0.00124 inductance, 1.300 holding torque and a max current of 2.8.
